# Auth0 Deploy CLI tenant configuration.
# Keep credentials in the CI environment, not in this file.

resourceServers:
  - name: XLAIR API
    identifier: https://api.xlair.dev
    signing_alg: RS256
    token_lifetime: 3600
    enforce_policies: true
    token_dialect: access_token_authz
    scopes:
      - value: admin
        description: Coarse-grained access class for administrator principals.
      - value: device
        description: Coarse-grained access class for device principals.

clients:
  - name: XLAIR Dashboard
    app_type: regular_web
    oidc_conformant: true
    grant_types:
      - authorization_code
    callbacks:
      - http://localhost:3000/auth/callback
    allowed_logout_urls:
      - http://localhost:3000
    web_origins:
      - http://localhost:3000
  - name: XLAIR Device
    app_type: non_interactive
    oidc_conformant: true
    grant_types:
      - client_credentials

clientGrants:
  - client_id: XLAIR Device
    audience: https://api.xlair.dev
    scope:
      - device

roles:
  - name: admin
    description: XLAIR administrator principal.
    permissions:
      - permission_name: admin
        resource_server_identifier: https://api.xlair.dev
