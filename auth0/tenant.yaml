# Auth0 Deploy CLI tenant configuration.
# Keep credentials in the CI environment, not in this file.

tenant:
  friendly_name: XLAIR
  picture_url: https://xlair.dev/icon.svg

branding:
  logo_url: https://xlair.dev/logo.svg
  favicon_url: https://xlair.dev/favicon.ico
  colors:
    primary: '#18ace9'
    page_background: '#4c5255'

resourceServers:
  - name: XLAIR API
    identifier: https://api.xlair.dev
    signing_alg: RS256
    token_lifetime: 3600
    enforce_policies: true
    token_dialect: access_token_authz
    skip_consent_for_verifiable_first_party_clients: true
    scopes:
      - value: device
        description: Coarse-grained access class for device principals.

clients:
  - name: XLAIR Dashboard
    app_type: regular_web
    oidc_conformant: true
    logo_uri: https://xlair.dev/icon.svg
    grant_types:
      - authorization_code
    callbacks:
      - http://localhost:3000/auth/callback
    allowed_logout_urls:
      - http://localhost:3000
    web_origins:
      - http://localhost:3000
  - name: XLAIR Device
    app_type: non_interactive
    oidc_conformant: true
    grant_types:
      - client_credentials

# Keep the dashboard limited to the GitHub connection. The existing default
# database connection is managed explicitly so AUTH0_ALLOW_DELETE=false does
# not leave it enabled for this application.
databases:
  - name: Username-Password-Authentication
    enabled_clients: []

connections:
  - name: github
    strategy: github
    enabled_clients:
      - XLAIR Dashboard
    options:
      client_id: "##AUTH0_GITHUB_CLIENT_ID##"
      client_secret: "##AUTH0_GITHUB_CLIENT_SECRET##"

actions:
  - name: Require XLAIR GitHub organization membership
    code: ./actions/require-xlair-org.js
    # Pin the runtime because this Action relies on the Node.js built-in Fetch API.
    runtime: node22
    deployed: true
    status: built
    secrets:
      - name: XLAIR_GITHUB_APP_CLIENT_ID
        value: "##XLAIR_GITHUB_APP_CLIENT_ID##"
      - name: XLAIR_GITHUB_APP_PRIVATE_KEY_BASE64
        value: "##XLAIR_GITHUB_APP_PRIVATE_KEY_BASE64##"
      - name: XLAIR_GITHUB_APP_INSTALLATION_ID
        value: "##XLAIR_GITHUB_APP_INSTALLATION_ID##"
    supported_triggers:
      - id: post-login
        version: v2

clientGrants:
  - client_id: XLAIR Device
    audience: https://api.xlair.dev
    scope:
      - device
triggers:
  post-login:
    - action_name: Require XLAIR GitHub organization membership
      display_name: Require XLAIR GitHub organization membership
