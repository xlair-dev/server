[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/infrastructure",
    "crates/migration",
    "crates/presentation",
    "crates/usecase",
]

[workspace.dependencies]
anyhow = "1.0.95"
aws-config = "1.12.0"
aws-sdk-s3 = "1.146.1"
axum = { version = "0.8.4", features = ["multipart"] }
base64 = "0.23.0"
bigdecimal = "0.4"
chrono = { version = "0.4.39", features = ["serde", "clock"] }
domain = { path = "crates/domain" }
dotenvy = "0.15.7"
getset = "0.1.4"
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
infrastructure = { path = "crates/infrastructure" }
jsonwebtoken = "9.3.1"
mockall = "0.15.0"
presentation = { path = "crates/presentation" }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1.1.16", features = [
    # https://www.sea-ql.org/SeaORM/docs/install-and-config/database-and-async-runtime/
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "mock",
    "with-chrono",
    "with-uuid",
] }
sea-orm-migration = { version = "1.1.0", features = [
    # https://www.sea-ql.org/SeaORM/docs/install-and-config/database-and-async-runtime/
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-chrono",
    "with-uuid",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.11"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.16"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.4"
usecase = { path = "crates/usecase" }
uuid = { version = "1.18.1", features = ["v4"] }
