name: Deploy Auth0 configuration

on:
  push:
    branches:
      - main
    paths:
      - auth0/**
      - .github/workflows/auth0-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Auth0 configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Auth0 Deploy CLI
        run: npm install --global auth0-deploy-cli@8.42.0

      - name: Preview and apply Auth0 configuration
        run: |
          a0deploy import \
            --config_file=auth0/config.json \
            --input_file=auth0/tenant.yaml \
            --dry-run \
            --apply
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_KEYWORD_REPLACE_MAPPINGS: >-
            {"AUTH0_GITHUB_CLIENT_ID":"${{ secrets.AUTH0_GITHUB_CLIENT_ID }}","AUTH0_GITHUB_CLIENT_SECRET":"${{ secrets.AUTH0_GITHUB_CLIENT_SECRET }}","XLAIR_GITHUB_APP_CLIENT_ID":"${{ secrets.XLAIR_GITHUB_APP_CLIENT_ID }}","XLAIR_GITHUB_APP_PRIVATE_KEY_BASE64":"${{ secrets.XLAIR_GITHUB_APP_PRIVATE_KEY_BASE64 }}","XLAIR_GITHUB_APP_INSTALLATION_ID":"${{ secrets.XLAIR_GITHUB_APP_INSTALLATION_ID }}"}
